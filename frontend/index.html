<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Viewport: Full responsive support for all devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />

    <!-- iOS specific -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hadescore Apex" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Android / Chrome -->
    <meta name="theme-color" content="#060912" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- SEO & Description -->
    <meta name="description" content="Hadescore Apex & Technologies — End-to-end technology, AI, cybersecurity, and talent acceleration ecosystem. Software development, mobile apps, AI solutions, cloud services, and startup incubation." />
    <meta name="keywords" content="Hadescore, Apex, Technologies, AI, Software Development, Cybersecurity, EduSkills, Digital Marketing, Web Development, Mobile Apps, Cloud Services, Talent Acceleration, Startup Incubation" />
    <meta name="author" content="Hadescore Apex & Technologies" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://hadescoreapex.com/" />

    <!-- Open Graph (Social sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hadescoreapex.com/" />
    <meta property="og:site_name" content="Hadescore Apex & Technologies" />
    <meta property="og:title" content="Hadescore Apex & Technologies | Software, AI & Talent Ecosystem" />
    <meta property="og:description" content="Build Digital. Build Fast. Build Right. — Technology & talent acceleration ecosystem integrating software engineering, AI, cybersecurity, and innovation labs." />
    <meta property="og:image" content="https://hadescoreapex.com/logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hadescore Apex & Technologies" />
    <meta name="twitter:description" content="End-to-end technology and talent acceleration ecosystem." />
    <meta name="twitter:image" content="https://hadescoreapex.com/logo.png" />
    <meta name="twitter:site" content="@HadescoreApex" />

    <!-- Additional SEO -->
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    <meta name="rating" content="general" />
    <meta name="distribution" content="global" />
    
    <!-- Prevent content from being zoomed in on double tap (iOS) -->
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Structured Data / JSON-LD Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Hadescore Apex & Technologies",
      "url": "https://hadescoreapex.com",
      "logo": "https://hadescoreapex.com/logo.png",
      "description": "Technology and talent acceleration ecosystem providing software development, AI solutions, cybersecurity, training, and startup incubation services.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Bengaluru",
        "addressRegion": "Karnataka",
        "addressCountry": "India"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-9790080274",
        "contactType": "Customer Service",
        "email": "hadescore.apex.technologies@gmail.com",
        "availableLanguage": ["English", "Hindi", "Tamil"]
      },
      "sameAs": [
        "https://www.linkedin.com/company/hadescore-apex-technologies",
        "https://www.instagram.com/hadescore_apex_offi"
      ]
    }
    </script>

    <title>Hadescore Apex & Technologies | Software, AI & Talent Ecosystem</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
